}
el("pinInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")checkPin();});

function startApp(){ show("app"); el("hdate").textContent=new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}); loadAll(); checkBackupReminder(); }

  cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',

const CACHE_KEY="henzo_cache_v4";
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({flocks:S.flocks,customers:S.customers,sales:S.sales,expenses:S.expenses,orders:S.orders}));}catch(e){}}
function loadCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY));}catch(e){return null;}}
function computeBalances(){
  const m={};
  S.sales.forEach(s=>{const n=s.customer_name||'—';const b=m[n]||(m[n]={id:n,name:n,transactions:0,billed:0,received:0,outstanding:0});
    b.transactions++;b.billed+=+s.total_amount;b.received+=+s.amount_paid;b.outstanding+=(+s.total_amount-+s.amount_paid);});
  return Object.values(m);
}
function setSync(state){
  const t=el("synctxt"),p=el("syncpill"); if(!t)return;
  if(state==='offline'){t.textContent="Offline · cached";p.style.color="var(--amber)";}
  else if(state==='updating'){t.textContent="Updating…";p.style.color="";}
  else{t.textContent="Cloud synced";p.style.color="";}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{

});
async function loadAll(){
  const c=loadCache();
  if(c && c.sales){ S={flocks:c.flocks||[],customers:c.customers||[],sales:c.sales||[],expenses:c.expenses||[],orders:c.orders||[],balances:[]}; S.balances=computeBalances(); render(); setSync('updating'); }
  else { el("view").innerHTML=`<div class="empty"><div class="big">🐔</div>Loading farm data…</div>`; }
  try{
    const [fl,cu,sa,ex,or]=await Promise.all([
      db.from("flocks").select("*").order("purchased"),
      db.from("customers").select("*").order("name"),
      db.from("sales").select("*").order("sale_date",{ascending:false}),
      db.from("expenses").select("*").order("expense_date",{ascending:false}),
      db.from("orders").select("*").order("delivery_date",{ascending:true})
    ]);
    for(const r of [fl,cu,sa,ex]) if(r.error) throw r.error;
    S={flocks:fl.data,customers:cu.data,sales:sa.data,expenses:ex.data,orders:or.error?[]:or.data,balances:[]}; S.balances=computeBalances();
    saveCache(); render(); setSync('synced');
  }catch(e){
    if(!(c&&c.sales)) el("view").innerHTML=`<div class="empty"><div class="big">⚠️</div><b>Couldn't load data</b><br>
      <span style="font-size:13px">${e.message||e}</span></div>`;
    setSync('offline');
  }
}

const BACKUP_KEY="henzo_last_backup";
function downloadFullBackup(silent){
  const payload={exported_at:new Date().toISOString(),flocks:S.flocks,customers:S.customers,sales:S.sales,expenses:S.expenses,orders:S.orders};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="henzo_full_backup_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  localStorage.setItem(BACKUP_KEY,new Date().toISOString());
  if(!silent) toast("Backup downloaded");
  checkBackupReminder();
}
function checkBackupReminder(){
  const last=localStorage.getItem(BACKUP_KEY);
  const days=last?Math.floor((Date.now()-new Date(last).getTime())/86400000):999;
  const host=el("backupBanner"); if(!host) return;
  if(days>=7){
    host.innerHTML=`<div class="banner"><span>💾 ${last?`It's been ${days} days since your last backup.`:'You have never downloaded a backup.'} Download one now to keep your data safe.</span>
      <button onclick="downloadFullBackup()">Download Backup</button></div>`;
  } else host.innerHTML="";
}

async function cancelOrder(o){
  if(!confirm(`Cancel order ${o.order_number||''} for ${o.customer_name}? This will NOT delete it — it just marks it Cancelled and removes it from your delivery list.`)) return;
  try{
    const {data:fresh,error:e0}=await db.from("orders").select("status").eq("id",o.id).single(); if(e0)throw e0;
    if(fresh.status==='Delivered'){toast("This order was already delivered — can't cancel it.",'err');await loadAll();return;}
    const {error}=await db.from("orders").update({status:'Cancelled'}).eq("id",o.id); if(error)throw error;

  }catch(e){toast(e.message,'err');}
}

function calcOrderTotal(){
  const dz=+el("o_dz").value||0, ppd=+el("o_ppd").value||0, eggSub=dz*ppd;
  const mkg=+el("o_mkg").value||0, mppk=+el("o_mppk").value||0, meatSub=mkg*mppk;
  const ch=+el("o_chicks").value||0, cp=+el("o_cp").value||0, chickSub=ch*cp;
  const dc=+el("o_dc").value||0, disc=+el("o_disc").value||0;
  const t=Math.max(0,eggSub+meatSub+chickSub+dc-disc);
  const parts=[];
  if(eggSub) parts.push(`Eggs ${moneyT(eggSub)}`);
  if(meatSub) parts.push(`Meat ${moneyT(meatSub)}`);
  if(chickSub) parts.push(`Chicks ${moneyT(chickSub)}`);
  if(dc) parts.push(`Delivery ${moneyT(dc)}`);
  if(disc) parts.push(`− Discount ${moneyT(disc)}`);
  el("o_hint").textContent = parts.length? `${parts.join(' + ')} = ${moneyT(t)}` : "Fill in items to auto-fill total";
  if(!o_touched && t>0) el("o_total").value=t;
}

function calcDeliverBalance(total){

async function confirmDeliver(o){
  const paid=+el("d_paid").value||0, method=el("d_method").value;
  try{
    const {data:fresh,error:e0}=await db.from("orders").select("status").eq("id",o.id).single();
    if(e0)throw e0;
    if(fresh.status==='Delivered'){toast("This order has already been completed.",'err');closeModal();await loadAll();return;}
    let cid=null;
    if(o.customer_name){let c=S.customers.find(x=>x.name.toLowerCase()===o.customer_name.toLowerCase());
      if(!c){const{data,error}=await db.from("customers").insert({name:o.customer_name,phone:o.phone||null}).select().single();if(error)throw error;c=data;}
      cid=c.id;}
    const notes=buildNotesWithMeat(`Order ${o.order_number||''}`.trim(), +o.meat_kg||0, +o.price_per_kg||0);
    const saleRec={sale_date:new Date().toISOString().slice(0,10),customer_id:cid,customer_name:o.customer_name,
      eggs_dozens:o.eggs_dozens||0,price_per_dozen:o.price_per_dozen||0,meat_birds:o.meat_birds||0,chicks:o.chicks||0,
      total_amount:o.total_amount,amount_paid:paid,payment_method:method,notes};
    const{error:e1}=await db.from("sales").insert(saleRec); if(e1)throw e1;
    const{error:e2}=await db.from("orders").update({status:'Delivered',delivered_at:new Date().toISOString()}).eq("id",o.id); if(e2)throw e2;

}

/* ---------- SALES: form ---------- */
let s_touched=false;
function parseMeatNote(notes){
  const m=(notes||'').match(/Meat:\s*([\d.]+)kg @ Rs([\d.]+)\/kg/);
  return m?{kg:+m[1],ppk:+m[2]}:{kg:0,ppk:0};
}
function buildNotesWithMeat(existingNotes,kg,ppk){
  const cleaned=(existingNotes||'').replace(/Meat:\s*[\d.]+kg @ Rs[\d.]+\/kg = Rs[\d.]+;?\s*/,'').trim();
  if(!(kg>0)) return cleaned||null;
  const tag=`Meat: ${kg}kg @ Rs${ppk}/kg = Rs${Math.round(kg*ppk)}`;
  return cleaned? `${cleaned}; ${tag}` : tag;
}
function saleForm(s,prefillName){const e=s||{};
  const meatInfo=parseMeatNote(e.notes);
  openModal(`<div class="modal"><div class="mh"><span class="bar"></span><h3>${s?'Edit sale':'New sale'}</h3></div>
    <div class="form">
      <div class="field"><label>Date</label><input id="s_date" type="date" value="${e.sale_date||new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Customer</label><input id="s_cust" list="cl" value="${(e.customer_name||prefillName||'').replace(/"/g,'&quot;')}" placeholder="Type or pick">
        <datalist id="cl">${S.customers.map(c=>`<option value="${c.name.replace(/"/g,'&quot;')}">`).join("")}</datalist></div>
      <div class="row2"><div class="field"><label>Eggs (dozens)</label><input id="s_dz" type="number" step="0.5" value="${e.eggs_dozens||0}" oninput="calcTotal()"></div>
        <div class="field"><label>Price / dozen</label><input id="s_ppd" type="number" value="${e.price_per_dozen||0}" oninput="calcTotal()"></div></div>
      <div class="row2"><div class="field"><label>Roasters / Meat (birds count)</label><input id="s_meat" type="number" value="${e.meat_birds||0}" oninput="calcTotal()"></div>
        <div class="field"><label>Chicks (count)</label><input id="s_chicks" type="number" value="${e.chicks||0}"></div></div>
      <div class="row2"><div class="field"><label>Meat weight (kg)</label><input id="s_mkg" type="number" step="0.1" value="${meatInfo.kg||0}" oninput="calcTotal()"></div>
        <div class="field"><label>Price / kg (meat)</label><input id="s_mppk" type="number" value="${meatInfo.ppk||1000}" oninput="calcTotal()"></div></div>
      <div class="row2"><div class="field"><label>Total (PKR)</label><input id="s_total" type="number" value="${e.total_amount||0}" oninput="s_touched=true;checkOverpay()"></div>
        <div class="field"><label>Paid (PKR)</label><input id="s_paid" type="number" value="${e.amount_paid!=null?e.amount_paid:''}" oninput="checkOverpay()"></div></div>
      <div class="hint" id="s_hint">Fill eggs and/or meat weight to auto-fill total</div>
      <div id="s_warn"></div>
      <div class="field"><label>Payment method</label><select id="s_method">
        <option ${e.payment_method==='Cash'?'selected':''}>Cash</option><option ${e.payment_method==='Online'?'selected':''}>Online</option></select></div>
    </div><div class="macts"><button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveSale('${s?s.id:''}')">${s?'Update':'Save sale'}</button></div></div>`);
  s_touched=!!s; calcTotal(); checkOverpay();
}
function calcTotal(){
  const dz=+el("s_dz").value||0,ppd=+el("s_ppd").value||0,eggSub=dz*ppd;
  const mkg=+el("s_mkg").value||0,mppk=+el("s_mppk").value||0,meatSub=mkg*mppk;
  const t=eggSub+meatSub;
  const parts=[];
  if(eggSub) parts.push(`Eggs ${moneyT(eggSub)}`);
  if(meatSub) parts.push(`Meat ${moneyT(meatSub)}`);
  el("s_hint").textContent = parts.length ? `${parts.join(' + ')} = ${moneyT(t)}` : "Fill eggs and/or meat weight to auto-fill total";
  if(!s_touched && t>0) el("s_total").value=t;
}
function checkOverpay(){
  const total=+el("s_total").value||0, paidRaw=el("s_paid").value, paid=paidRaw===""?total:(+paidRaw||0);
  const w=el("s_warn"); if(!w) return;
  if(paid>total){
    w.innerHTML=`<div class="warn">⚠️ Paid (${moneyT(paid)}) is more than Total (${moneyT(total)}). This usually means a payment for a DIFFERENT sale got typed here by mistake. If this customer is paying for something else too (e.g. eggs + meat), cancel and create a SEPARATE sale for that instead.</div>`;
  } else w.innerHTML="";
}
async function saveSale(id){
  const name=el("s_cust").value.trim(), total=+el("s_total").value||0;
  let pv=el("s_paid").value; pv=pv===""?total:(+pv||0);
  if(pv>total){
    const ok=confirm("Paid is more than Total for this single sale.\n\nThis is usually a mistake — a second payment for a different item got typed into this sale.\n\nDo you still want to save it this way?");
    if(!ok) return;
  }
  const mkg=+el("s_mkg").value||0, mppk=+el("s_mppk").value||0;
  const rec={sale_date:el("s_date").value,customer_name:name||null,eggs_dozens:+el("s_dz").value||0,
    price_per_dozen:+el("s_ppd").value||0,meat_birds:+el("s_meat").value||0,chicks:+el("s_chicks").value||0,
    total_amount:total,amount_paid:pv,payment_method:el("s_method").value,
    notes:buildNotesWithMeat(id?(S.sales.find(x=>x.id===id)||{}).notes:'',mkg,mppk)};
  try{
    let cid=null;
    if(name){let c=S.customers.find(x=>x.name.toLowerCase()===name.toLowerCase());
      if(!c){const{data,error}=await db.from("customers").insert({name}).select().single();if(error)throw error;c=data;S.customers.push(c);}
      cid=c.id;}
    rec.customer_id=cid;
    const {error}= id? await db.from("sales").update(rec).eq("id",id) : await db.from("sales").insert(rec);
    if(error)throw error; toast(id?"Sale updated":"Sale saved"); closeModal(); await loadAll();
  }catch(e){toast(e.message||"Error",'err');}
}

/* ---------- EXPENSES: form & feed history ---------- */
function feedHistoryHTML(){
  const feeds=S.expenses.filter(e=>e.category==='Feed').sort((a,b)=>new Date(a.expense_date)-new Date(b.expense_date));
  if(!feeds.length) return "";
  const today=new Date(); today.setHours(0,0,0,0);
  const rows=feeds.map((f,i)=>{
    const next = i<feeds.length-1 ? new Date(feeds[i+1].expense_date) : today;
    const days=Math.max(0,Math.round((next-new Date(f.expense_date))/86400000));
    return {...f,days,ongoing:i===feeds.length-1};
  });
  const last5=rows.slice(-5).reverse();
  const closed=rows.filter(r=>!r.ongoing && r.days>0);
  const avgDays=closed.length?Math.round(closed.reduce((a,r)=>a+r.days,0)/closed.length):0;
  const avgCostDay=closed.length?Math.round(closed.reduce((a,r)=>a+ +r.amount,0)/closed.reduce((a,r)=>a+r.days,0)):0;
  const lastFeed=feeds[feeds.length-1];
  const daysSinceLast=Math.max(0,Math.round((today-new Date(lastFeed.expense_date))/86400000));
  const overdue = avgDays>0 && daysSinceLast>avgDays;
  const body=last5.map(f=>{
    const bought = +f.qty>0 ? `${numf(f.qty)} ${f.unit||'kg'}` : (f.description||'Feed');
    return `<tr><td class="dt">${fmtDate(f.expense_date)}</td><td>${bought}</td>
      <td class="num money">${moneyT(f.amount)}</td>
      <td class="num">${f.ongoing?`<span class="clr">${f.days} days so far</span>`:`<b>${f.days} days</b>`}</td></tr>`;
  }).join("");
  return `<div class="panel" style="margin-bottom:16px"><div class="ph"><span class="bar" style="background:var(--emerald)"></span>
      <h3>Feed History — how long each purchase lasts</h3><span class="sp"></span>
      <span class="chip feed">Avg ~${avgDays} days · ${moneyT(avgCostDay)}/day</span></div>
    <div class="pb" style="padding-top:0">
      <div class="${overdue?'warn':'hint'}" style="margin-bottom:12px">
        ${overdue?`⚠️ It's been ${daysSinceLast} days since the last feed purchase (${fmtDate(lastFeed.expense_date)}) — that's longer than your usual ~${avgDays} days. You may be close to running out, or a recent purchase wasn't logged.`
        :`Last feed bought ${daysSinceLast} day${daysSinceLast===1?'':'s'} ago (${fmtDate(lastFeed.expense_date)}). Usually lasts ~${avgDays} days.`}
      </div>
    </div>
    <div class="twrap"><table><thead><tr><th>Date</th><th>Bought</th><th class="num">Cost</th><th class="num">Lasted</th></tr></thead>
    <tbody>${body}</tbody></table></div></div>`;
}

function msHTML(grp,key,label,opts){

function msTog(grp,key,inp){

function setRange(grp,p){
  const t=new Date(); let a='',b='';
  if(p==='today') a=b=ymd(t);
  else if(p==='7d'){const d=new Date();d.setDate(d.getDate()-6);a=ymd(d);b=ymd(t);}
  else if(p==='30d'){const d=new Date();d.setDate(d.getDate()-29);a=ymd(d);b=ymd(t);}
  else if(p==='month'){a=ymd(new Date(t.getFullYear(),t.getMonth(),1));b=ymd(t);}
  F[grp].from=a;F[grp].to=b; el(grp+'_from').value=a; el(grp+'_to').value=b; REF[grp]();
}

function csvOut(name,head,rows){

  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=name+"_"+new Date().toISOString().slice(0,10)+".csv";a.click();toast("Downloaded "+a.download);
}

/* ================= SALES HELPERS ================= */
function sParts(s){
  const m=parseMeatNote(s.notes), dz=+s.eggs_dozens||0, ppd=+s.price_per_dozen||0, tot=+s.total_amount||0;
  const eggRev=dz*ppd, meatRev=m.kg*m.ppk;
  return {dz,birds:+s.meat_birds||0,kg:m.kg,chicks:+s.chicks||0,eggRev,meatRev,chickRev:Math.max(0,tot-eggRev-meatRev)};
}
function sHas(s,k){const p=sParts(s);return k==='eggs'?p.dz>0:k==='meat'?(p.birds>0||p.kg>0):p.chicks>0;}
const ITEM_OPTS=[{v:'eggs',l:'🥚 Eggs'},{v:'meat',l:'🍗 Roasters / Meat'},{v:'chicks',l:'🐣 Chicks'}];

/* itemLabel now also shows meat sold via Orders (kg only, birds = 0) */
function itemLabel(s){
  const p=sParts(s), out=[];
  if(p.dz>0) out.push(`<span class="chip eggs">🥚 ${numf(p.dz)} dz</span>`);
  if(p.birds>0||p.kg>0) out.push(`<span class="chip meat">🍗 ${p.birds>0?numf(p.birds)+' roaster'+(p.birds>1?'s':''):''}${p.kg?(p.birds>0?` (${p.kg}kg)`:`${p.kg} kg`):''}</span>`);
  if(p.chicks>0) out.push(`<span class="chip chicks">🐣 ${numf(p.chicks)} chicks</span>`);
  return out.join(" ")||'<span class="chip misc">—</span>';
}

        <tbody>${rows.map(o=>`<tr>
          <td class="dt">${o.order_number||'—'}</td><td class="cust">${o.customer_name}</td><td class="dt">${o.phone||'—'}</td>
          <td>${orderItemLabel(o)}</td><td class="num money">${moneyT(o.total_amount)}</td>
          <td><span class="chip ${o.status==='Delivered'?'online':o.status==='Cancelled'?'meat':'cash'}">${o.status}</span></td>
          <td class="num" style="white-space:nowrap">
            <button class="iconbtn" title="Print bill" onclick='printInvoice(${JSON.stringify(o)})'>🖨️</button>
            ${o.status==='Pending'?`<button class="iconbtn" onclick='orderForm(${JSON.stringify(o)})'>${ICN.edit}</button>
            <button class="btn sm" style="background:var(--emerald)" onclick='deliverOrder(${JSON.stringify(o)})'>Delivered</button>
            <button class="btn ghost sm" style="color:var(--red)" onclick='cancelOrder(${JSON.stringify(o)})'>Cancel</button>`:''}
            <button class="iconbtn del" onclick="delRow('orders','${o.id}');" title="Delete order">${ICN.del}</button>
          </td></tr>`).join("")}</tbody></table></div></div>`;
  }).join("");
}

/* ================= CUSTOMERS ================= */
function cusData(){
  const f=F.cus;
  const sales=S.sales.filter(s=>{
    if(f.items.size && ![...f.items].some(k=>sHas(s,k))) return false;
    if(f.from && s.sale_date<f.from) return false;
    if(f.to && s.sale_date>f.to) return false;
    return true;
  });
  const m={};
  sales.forEach(s=>{const n=s.customer_name||'—';const b=m[n]||(m[n]={name:n,transactions:0,billed:0,received:0,outstanding:0});
    b.transactions++;b.billed+= +s.total_amount;b.received+= +s.amount_paid;b.outstanding+=(+s.total_amount-+s.amount_paid);});
  return Object.values(m).filter(c=>{
    if(f.q && !c.name.toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.status.size){const st=c.outstanding>0?'due':'clear'; if(!f.status.has(st)) return false;}
    return true;
  }).sort((a,b)=>b.outstanding-a.outstanding||b.billed-a.billed);
}
function vCustomers(){
  el("view").innerHTML=`
    <div class="toolbar">
      <div class="search">${ICN.search}<input placeholder="Search customer…" value="${esc(F.cus.q)}" oninput="F.cus.q=this.value;REF.cus()"></div>
      ${msHTML('cus','status','Balance',[{v:'due',l:'Has outstanding'},{v:'clear',l:'Clear'}])}
      ${msHTML('cus','items','Bought',ITEM_OPTS)}
    </div>
    <div class="toolbar second">
      ${rangeHTML('cus')}
      <div style="flex:1"></div>
      ${resetBtn('cus')}
      <button class="btn" onclick="custForm()">${ICN.plus} Add Customer</button>
    </div>
    <div id="cusSum"></div>
    <div class="tcard"><div class="twrap"><table>
      <thead><tr><th>Customer</th><th class="num">Sales</th><th class="num">Billed</th><th class="num">Received</th><th class="num">Balance</th><th class="num">Actions</th></tr></thead>
      <tbody id="cusBody"></tbody></table></div></div>`;
  REF.cus=renderCusRows; renderCusRows();
}
function renderCusRows(){
  const b=cusData(), due=b.reduce((a,c)=>a+c.outstanding,0), billed=b.reduce((a,c)=>a+c.billed,0), rec=b.reduce((a,c)=>a+c.received,0);
  el("cusSum").innerHTML=`<div class="kpis">${kp('Customers',numf(b.length),'matching filters','i-indigo')}${kp('Billed',money(billed),'&nbsp;','i-indigo')}${kp('Received',money(rec),'&nbsp;','i-emerald','v-emerald')}${kp('Outstanding',money(due),'&nbsp;','i-red','v-red')}</div>`;
  el("cusBody").innerHTML=b.map(c=>`<tr><td class="cust" style="cursor:pointer" onclick="custHistory('${c.name.replace(/'/g,"\\'")}')">${c.name}</td><td class="num">${numf(c.transactions)}</td>
    <td class="num money">${moneyT(c.billed)}</td><td class="num clr">${moneyT(c.received)}</td>
    <td class="num">${c.outstanding>0?`<span class="due">${moneyT(c.outstanding)}</span>`:`<span class="clr">Clear</span>`}</td>
    <td class="num"><button class="btn ghost sm" onclick="saleForm(null,'${c.name.replace(/'/g,"\\'")}')">+ Sale/Payment</button></td></tr>`).join("")
    ||'<tr><td colspan=6 class="empty">No customers match</td></tr>';
}

/* ================= FLOCKS ================= */
function vFlocks(){
  el("view").innerHTML=`
    <div class="toolbar">
      ${msHTML('flk','ids','Flocks',S.flocks.map(f=>({v:String(f.id),l:esc(f.name),n:numf(f.live_birds)+' live'})))}
      <div style="flex:1"></div>
      ${resetBtn('flk')}
      <button class="btn" onclick="flockForm()">${ICN.plus} Add Flock</button>
    </div>
    <div id="flkSum"></div><div class="flocks" id="flkCards"></div>`;
  REF.flk=renderFlocks; renderFlocks();
}
function renderFlocks(){
  const fl=S.flocks.filter(f=>!F.flk.ids.size||F.flk.ids.has(String(f.id)));
  const spentOf=f=>S.expenses.filter(e=>e.flock_id===f.id).reduce((a,e)=>a+ +e.amount,0);
  const T={st:0,d:0,so:0,l:0,sp:0}; fl.forEach(f=>{T.st+=+f.start_count||0;T.d+=+f.mortality||0;T.so+=+f.sold||0;T.l+=+f.live_birds||0;T.sp+=spentOf(f);});
  el("flkSum").innerHTML=`<div class="kpis">${kp('Started',numf(T.st),`${fl.length} flock${fl.length===1?'':'s'}`,'i-indigo')}${kp('Died',numf(T.d),T.st?(T.d/T.st*100).toFixed(1)+'% mortality':'&nbsp;','i-red','v-red')}${kp('Sold',numf(T.so),'&nbsp;','i-amber')}${kp('Live Birds',numf(T.l),'&nbsp;','i-emerald','v-emerald')}${kp('Spent (tagged)',money(T.sp),'&nbsp;','i-amber')}</div>`;
  el("flkCards").innerHTML=fl.map(f=>{
    const spent=spentOf(f), start=+f.start_count||0,mort=+f.mortality||0,sold=+f.sold||0,live=+f.live_birds,surv=start?((live/start)*100).toFixed(1):0;
    return `<div class="fcard"><div class="fh"><h3>${f.name}</h3><span class="tag">${f.breed||'—'}</span>
      <span style="flex:1"></span><button class="iconbtn" onclick='flockForm(${JSON.stringify(f)})'>${ICN.edit}</button></div>
      <div class="dt" style="font-size:12px;margin-bottom:8px">Purchased ${fmtDate(f.purchased)}</div>
      <div class="fstats" style="grid-template-columns:repeat(4,1fr)">
        <div class="fstat"><div class="l">Start</div><div class="n">${numf(start)}</div></div>
        <div class="fstat"><div class="l">Died</div><div class="n v-red">${numf(mort)}</div></div>
        <div class="fstat"><div class="l">Sold</div><div class="n">${numf(sold)}</div></div>
        <div class="fstat"><div class="l">Live</div><div class="n v-emerald">${numf(live)}</div></div></div>
      <div class="prog"><i style="width:${surv}%"></i></div>
      <div class="prog-lbl"><span>Survival ${surv}%</span><span>Spent ${moneyT(spent)}</span></div></div>`;
  }).join("")||'<div class="empty">No flocks match</div>';
}

/* ================= REPORTS (date-range) ================= */
function vReports(){
  el("view").innerHTML=`
    <div class="toolbar">${rangeHTML('rep')}<div style="flex:1"></div>${resetBtn('rep')}</div>
    <div id="repBody"></div>
    <div class="tcard"><div class="ph" style="padding:18px 20px"><span class="bar"></span><h3>Export Data</h3></div>
      <div class="pb" style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn ghost" onclick="exportCSV('sales')">⬇ All Sales (CSV)</button>
        <button class="btn ghost" onclick="exportCSV('expenses')">⬇ All Expenses (CSV)</button>
        <button class="btn" onclick="downloadFullBackup()">${ICN.download} Download Full Backup (JSON)</button>
        <button class="btn ghost" onclick="window.print()">🖨 Print this report</button>
      </div>
      <div class="pb" style="padding-top:0"><span class="hint" id="lastBackupHint"></span></div></div>`;
  const last=localStorage.getItem(BACKUP_KEY);
  el("lastBackupHint").textContent=last?`Last full backup: ${new Date(last).toLocaleString()}`:"You haven't downloaded a full backup yet.";
  REF.rep=renderReport; renderReport();
}
function renderReport(){
  const f=F.rep, inR=d=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
  const sales=S.sales.filter(s=>inR(s.sale_date)), exps=S.expenses.filter(e=>inR(e.expense_date));
  const rev=sales.reduce((a,s)=>a+ +s.total_amount,0), paid=sales.reduce((a,s)=>a+ +s.amount_paid,0);
  const sumT=t=>exps.filter(e=>e.type===t).reduce((a,e)=>a+ +e.amount,0);
  const opCost=sumT('operating'), capex=sumT('capex'), bird=sumT('biological'), opProfit=rev-opCost;
  const T={dz:0,birds:0,kg:0,chicks:0,eggRev:0,meatRev:0,chickRev:0}; sales.forEach(s=>{const p=sParts(s);for(const k in T)T[k]+=p[k];});
  const custs=new Set(sales.map(s=>s.customer_name||'—')).size;
  const byC={}; exps.forEach(e=>{const c=e.category||'Misc';byC[c]=(byC[c]||0)+ +e.amount;});
  const catRows=Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td><span class="chip ${c.toLowerCase()}">${c}</span></td><td class="num money">${moneyT(v)}</td></tr>`).join('');
  el("repBody").innerHTML=`
    <div class="grid-2" style="grid-template-columns:1fr 1fr">
      <div class="panel"><div class="ph"><span class="bar"></span><h3>Profit &amp; Loss Summary</h3></div>
        <div class="pb"><table><tbody>
          <tr><td>Total Revenue</td><td class="num money v-emerald">${moneyT(rev)}</td></tr>
          <tr><td>Cash Collected</td><td class="num money">${moneyT(paid)}</td></tr>
          <tr><td>Outstanding Khata</td><td class="num money v-red">${moneyT(rev-paid)}</td></tr>
          <tr><td>Operating Cost</td><td class="num money v-red">${moneyT(opCost)}</td></tr>
          <tr style="border-top:2px solid var(--line-2)"><td style="font-weight:800">Operating ${opProfit>=0?'Profit':'Loss'}</td>
            <td class="num money ${opProfit>=0?'v-emerald':'v-red'}" style="font-size:16px">${moneyT(opProfit)}</td></tr>
          <tr><td class="dt">Capital Invested (setup)</td><td class="num money">${moneyT(capex)}</td></tr>
          <tr><td class="dt">Bird Investment (chicks)</td><td class="num money">${moneyT(bird)}</td></tr>
        </tbody></table></div></div>
      <div class="panel"><div class="ph"><span class="bar" style="background:var(--emerald)"></span><h3>Sales by Item</h3></div>
        <div class="pb"><table><thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Revenue</th></tr></thead><tbody>
          <tr><td>🥚 Eggs</td><td class="num">${numf(T.dz)} dz · ${numf(Math.round(T.dz*12))} pcs</td><td class="num money">${moneyT(T.eggRev)}</td></tr>
          <tr><td>🍗 Roasters / Meat</td><td class="num">${numf(T.birds)} birds · ${numf(+T.kg.toFixed(1))} kg</td><td class="num money">${moneyT(T.meatRev)}</td></tr>
          <tr><td>🐣 Chicks</td><td class="num">${numf(T.chicks)}</td><td class="num money">${moneyT(T.chickRev)}</td></tr>
          <tr style="border-top:2px solid var(--line-2)"><td>Transactions</td><td class="num money">${numf(sales.length)}</td><td></td></tr>
          <tr><td>Active Customers</td><td class="num money">${numf(custs)}</td><td></td></tr>
          <tr><td>Live Birds (now)</td><td class="num money">${numf(S.flocks.reduce((a,x)=>a+ +x.live_birds,0))}</td><td></td></tr>
        </tbody></table></div></div>
    </div>
    <div class="panel" style="margin-bottom:16px"><div class="ph"><span class="bar" style="background:var(--amber)"></span><h3>Expenses by Category</h3></div>
      <div class="pb"><table><tbody>${catRows||'<tr><td class="empty">No expenses in this period</td></tr>'}</tbody></table></div></div>`;
}

</script>
