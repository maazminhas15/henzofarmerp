<!-- ==========================================================
  HENZO FARM ERP — ADVANCED FILTERS PATCH
  PASTE THIS WHOLE BLOCK in index.html RIGHT BEFORE </body>
  (after the last </script>). Nothing else needs to change.
  ========================================================== -->
<style>
  .ms{position:relative}
  .ms>summary{list-style:none;cursor:pointer;padding:11px 14px;border:1px solid var(--line-2);border-radius:11px;background:#fff;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none;white-space:nowrap}
  .ms>summary::-webkit-details-marker{display:none}
  .ms>summary::after{content:"▾";color:var(--faint);font-size:11px}
  .ms[open]>summary{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .msb{background:var(--indigo);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
  .msp{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:240px;max-height:330px;overflow:auto;background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px}
  .msa{display:flex;justify-content:space-between;padding:4px 8px 8px;font-size:12px;font-weight:700}
  .msa a{color:var(--indigo);cursor:pointer}
  .msi{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px}
  .msi:hover{background:var(--indigo-soft)}
  .msi input{width:16px;height:16px;accent-color:var(--indigo)}
  .msi span{flex:1}
  .msi em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .pchip{padding:9px 12px;border-radius:9px;background:#fff;border:1px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--muted)}
  .pchip:hover{color:var(--indigo);border-color:var(--indigo)}
  .cntline{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 2px 10px}
  .bar-bg{height:7px;background:var(--line-2);border-radius:6px;min-width:90px;overflow:hidden}
  .bar-bg i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--indigo-2))}
  .toolbar.second{margin-top:-6px}
</style>

<script>
/* ================= FILTER ENGINE ================= */
const FD=()=>({
  sales:{q:'',items:new Set(),methods:new Set(),status:new Set(),custs:new Set(),from:'',to:''},
  exp:{q:'',cats:new Set(),types:new Set(),scopes:new Set(),from:'',to:''},
  ord:{q:'',status:new Set(['Pending']),items:new Set(),from:'',to:''},
  cus:{q:'',status:new Set(),items:new Set(),from:'',to:''},
  flk:{ids:new Set()},
  rep:{from:'',to:''}
});
let F=FD();
const REF={};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const kp=(label,val,foot,ico,cls)=>`<div class="kpi"><div class="top"><span class="label">${label}</span><span class="ico ${ico||'i-indigo'}">${ICN.chart}</span></div><div class="val ${cls||''}">${val}</div><div class="foot">${foot||'&nbsp;'}</div></div>`;

function msBadge(det,set){
  const sm=det.querySelector('summary'); let b=sm.querySelector('.msb');
  if(set.size){ if(!b){b=document.createElement('b');b.className='msb';sm.appendChild(b);} b.textContent=set.size; }
  else if(b) b.remove();
}
function msHTML(grp,key,label,opts){
  const set=F[grp][key];
  return `<details class="ms"><summary>${label}${set.size?`<b class="msb">${set.size}</b>`:''}</summary><div class="msp">
    <div class="msa"><a onclick="msAll('${grp}','${key}',true,this)">Select all</a><a onclick="msAll('${grp}','${key}',false,this)">Clear</a></div>
    ${opts.map(o=>`<label class="msi"><input type="checkbox" value="${esc(o.v)}" ${set.has(o.v)?'checked':''} onchange="msTog('${grp}','${key}',this)"><span>${o.l}</span>${o.n!=null?`<em>${o.n}</em>`:''}</label>`).join('')}
  </div></details>`;
}
function msTog(grp,key,inp){
  const set=F[grp][key]; inp.checked?set.add(inp.value):set.delete(inp.value);
  msBadge(inp.closest('details'),set); REF[grp]();
}
function msAll(grp,key,all,a){
  const set=F[grp][key], det=a.closest('details'); set.clear();
  det.querySelectorAll('input').forEach(i=>{i.checked=all; if(all)set.add(i.value);});
  msBadge(det,set); REF[grp]();
}
document.addEventListener('click',e=>{document.querySelectorAll('details.ms[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open');});});

function rangeHTML(grp){
  const f=F[grp];
  return `<input class="sel" type="date" id="${grp}_from" title="From" value="${f.from}" onchange="F.${grp}.from=this.value;REF.${grp}()">
    <input class="sel" type="date" id="${grp}_to" title="To" value="${f.to}" onchange="F.${grp}.to=this.value;REF.${grp}()">
    <div class="presets">
      <button class="pchip" onclick="setRange('${grp}','today')">Today</button>
      <button class="pchip" onclick="setRange('${grp}','7d')">7 days</button>
      <button class="pchip" onclick="setRange('${grp}','month')">This month</button>
      <button class="pchip" onclick="setRange('${grp}','30d')">30 days</button>
      <button class="pchip" onclick="setRange('${grp}','all')">All</button>
    </div>`;
}
function setRange(grp,p){
  const t=new Date(); let a='',b='';
  if(p==='today') a=b=ymd(t);
  else if(p==='7d'){const d=new Date();d.setDate(d.getDate()-6);a=ymd(d);b=ymd(t);}
  else if(p==='30d'){const d=new Date();d.setDate(d.getDate()-29);a=ymd(d);b=ymd(t);}
  else if(p==='month'){a=ymd(new Date(t.getFullYear(),t.getMonth(),1));b=ymd(t);}
  F[grp].from=a;F[grp].to=b; el(grp+'_from').value=a; el(grp+'_to').value=b; REF[grp]();
}
function clearF(grp){F[grp]=FD()[grp];render();}
const resetBtn=g=>`<button class="btn ghost sm" onclick="clearF('${g}')">✕ Reset filters</button>`;
function csvOut(name,head,rows){
  const csv=[head.join(","),...rows.map(r=>r.map(v=>`"${(v??"").toString().replace(/"/g,'""')}"`).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=name+"_"+new Date().toISOString().slice(0,10)+".csv";a.click();toast("Downloaded "+a.download);
}

/* ================= SALES HELPERS ================= */
function sParts(s){
  const m=parseMeatNote(s.notes), dz=+s.eggs_dozens||0, ppd=+s.price_per_dozen||0, tot=+s.total_amount||0;
  const eggRev=dz*ppd, meatRev=m.kg*m.ppk;
  return {dz,birds:+s.meat_birds||0,kg:m.kg,chicks:+s.chicks||0,eggRev,meatRev,chickRev:Math.max(0,tot-eggRev-meatRev)};
}
function sHas(s,k){const p=sParts(s);return k==='eggs'?p.dz>0:k==='meat'?(p.birds>0||p.kg>0):p.chicks>0;}
const ITEM_OPTS=[{v:'eggs',l:'🥚 Eggs'},{v:'meat',l:'🍗 Roasters / Meat'},{v:'chicks',l:'🐣 Chicks'}];

/* itemLabel now also shows meat sold via Orders (kg only, birds = 0) */
function itemLabel(s){
  const p=sParts(s), out=[];
  if(p.dz>0) out.push(`<span class="chip eggs">🥚 ${numf(p.dz)} dz</span>`);
  if(p.birds>0||p.kg>0) out.push(`<span class="chip meat">🍗 ${p.birds>0?numf(p.birds)+' roaster'+(p.birds>1?'s':''):''}${p.kg?(p.birds>0?` (${p.kg}kg)`:`${p.kg} kg`):''}</span>`);
  if(p.chicks>0) out.push(`<span class="chip chicks">🐣 ${numf(p.chicks)} chicks</span>`);
  return out.join(" ")||'<span class="chip misc">—</span>';
}

/* ================= SALES ================= */
function salesFiltered(){
  const f=F.sales;
  return S.sales.filter(s=>{
    if(f.q && !(s.customer_name||'').toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.items.size && ![...f.items].some(k=>sHas(s,k))) return false;
    if(f.methods.size && !f.methods.has(s.payment_method||'Cash')) return false;
    if(f.status.size){const st=(+s.total_amount-+s.amount_paid)>0?'pending':'paid'; if(!f.status.has(st)) return false;}
    if(f.custs.size && !f.custs.has(s.customer_name||'—')) return false;
    if(f.from && s.sale_date<f.from) return false;
    if(f.to && s.sale_date>f.to) return false;
    return true;
  });
}
function vSales(){
  const cc={}; S.sales.forEach(s=>{const n=s.customer_name||'—';cc[n]=(cc[n]||0)+1;});
  const custOpts=Object.keys(cc).sort().map(n=>({v:n,l:esc(n),n:cc[n]}));
  el("view").innerHTML=`
    <div class="toolbar">
      <div class="search">${ICN.search}<input placeholder="Search customer…" value="${esc(F.sales.q)}" oninput="F.sales.q=this.value;REF.sales()"></div>
      ${msHTML('sales','items','Items',ITEM_OPTS)}
      ${msHTML('sales','methods','Payment',[{v:'Cash',l:'💵 Cash'},{v:'Online',l:'📱 Online'}])}
      ${msHTML('sales','status','Status',[{v:'paid',l:'✓ Fully paid'},{v:'pending',l:'Balance pending'}])}
      ${msHTML('sales','custs','Customers',custOpts)}
    </div>
    <div class="toolbar second">
      ${rangeHTML('sales')}
      <div style="flex:1"></div>
      ${resetBtn('sales')}
      <button class="btn ghost sm" onclick="exportSalesFiltered()">⬇ CSV</button>
      <button class="btn" onclick="saleForm()">${ICN.plus} New Sale</button>
    </div>
    <div id="salesSum"></div>
    <div class="cntline" id="salesCnt"></div>
    <div class="tcard"><div class="twrap"><table>
      <thead><tr><th>Date</th><th>Customer</th><th>Items</th><th class="num">Total</th><th class="num">Received</th><th class="num">Balance</th><th>Method</th><th class="num">Actions</th></tr></thead>
      <tbody id="salesBody"></tbody></table></div></div>`;
  REF.sales=renderSalesRows; renderSalesRows();
}
function renderSalesRows(){
  const list=salesFiltered(), sel=F.sales.items, show=k=>!sel.size||sel.has(k);
  const T={dz:0,birds:0,kg:0,chicks:0,eggRev:0,meatRev:0,chickRev:0,tot:0,paid:0};
  list.forEach(s=>{const p=sParts(s);T.dz+=p.dz;T.birds+=p.birds;T.kg+=p.kg;T.chicks+=p.chicks;T.eggRev+=p.eggRev;T.meatRev+=p.meatRev;T.chickRev+=p.chickRev;T.tot+=+s.total_amount;T.paid+=+s.amount_paid;});
  const rev=sel.size?((show('eggs')?T.eggRev:0)+(show('meat')?T.meatRev:0)+(show('chicks')?T.chickRev:0)):T.tot;
  const cards=[];
  if(show('eggs')) cards.push(kp('Eggs Sold',`${numf(T.dz)} <span style="font-size:14px;color:var(--faint)">dozen</span>`,`${numf(Math.round(T.dz*12))} eggs (pieces) · ${moneyT(T.eggRev)}`,'i-indigo'));
  if(show('meat')) cards.push(kp('Roasters Sold',`${numf(T.birds)} <span style="font-size:14px;color:var(--faint)">birds</span>`,`${numf(+T.kg.toFixed(1))} kg meat · ${moneyT(T.meatRev)}`,'i-red'));
  if(show('chicks')) cards.push(kp('Chicks Sold',`${numf(T.chicks)}`,moneyT(T.chickRev),'i-amber'));
  cards.push(kp(sel.size?'Revenue (selected items)':'Revenue',money(rev),`${numf(list.length)} sale${list.length===1?'':'s'}`,'i-indigo','v-indigo'));
  cards.push(kp('Cash Received',money(T.paid),sel.size?'whole matching sales':'&nbsp;','i-emerald','v-emerald'));
  cards.push(kp('Outstanding',money(T.tot-T.paid),sel.size?'whole matching sales':'&nbsp;','i-red','v-red'));
  el("salesSum").innerHTML=`<div class="kpis">${cards.join('')}</div>`;
  el("salesCnt").textContent=`Showing ${list.length} of ${S.sales.length} sales`;
  el("salesBody").innerHTML=list.map(s=>`<tr>
    <td class="dt">${fmtDate(s.sale_date)}</td><td class="cust">${s.customer_name||"—"}</td><td>${itemLabel(s)}</td>
    <td class="num money">${moneyT(s.total_amount)}</td><td class="num clr">${moneyT(s.amount_paid)}</td>
    <td class="num">${(+s.total_amount-+s.amount_paid)>0?`<span class="due">${moneyT(s.total_amount-s.amount_paid)}</span>`:`<span class="clr">✓</span>`}</td>
    <td><span class="chip ${(s.payment_method||'cash').toLowerCase()}">${s.payment_method||'Cash'}</span></td>
    <td class="num"><button class="iconbtn" onclick='saleForm(${JSON.stringify(s)})'>${ICN.edit}</button>
      <button class="iconbtn del" onclick="delRow('sales','${s.id}')">${ICN.del}</button></td></tr>`).join("")
    ||`<tr><td colspan=8 class="empty"><div class="big">📋</div>No sales match these filters</td></tr>`;
}
function exportSalesFiltered(){
  csvOut("henzo_sales_filtered",["Date","Customer","Eggs_Dozens","Eggs_Pieces","Roasters","Meat_Kg","Chicks","Total","Paid","Balance","Method"],
    salesFiltered().map(s=>{const p=sParts(s);return [s.sale_date,s.customer_name,p.dz,p.dz*12,p.birds,p.kg,p.chicks,s.total_amount,s.amount_paid,s.total_amount-s.amount_paid,s.payment_method];}));
}

/* ================= EXPENSES ================= */
const TYPE_LBL={operating:'Operating (day-to-day)',capex:'Capital (shed, labour)',biological:'Bird investment (chicks)'};
function expFiltered(){
  const f=F.exp;
  return S.expenses.filter(e=>{
    if(f.q && !(e.description||'').toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.cats.size && !f.cats.has(e.category||'Misc')) return false;
    if(f.types.size && !f.types.has(e.type||'operating')) return false;
    if(f.scopes.size && !f.scopes.has(e.flock_scope||'General')) return false;
    if(f.from && e.expense_date<f.from) return false;
    if(f.to && e.expense_date>f.to) return false;
    return true;
  });
}
function vExpenses(){
  const tot={}; S.expenses.forEach(e=>{const c=e.category||'Misc';tot[c]=(tot[c]||0)+ +e.amount;});
  ["Feed","Vaccine","Chicks","Misc","Visit","Labour","Shed"].forEach(c=>{if(!(c in tot))tot[c]=0;});
  const catOpts=Object.keys(tot).sort().map(c=>({v:c,l:c,n:moneyT(tot[c])}));
  el("view").innerHTML=`
    <div class="toolbar">
      <div class="search">${ICN.search}<input placeholder="Search description…" value="${esc(F.exp.q)}" oninput="F.exp.q=this.value;REF.exp()"></div>
      ${msHTML('exp','cats','Categories',catOpts)}
      ${msHTML('exp','types','Type',Object.keys(TYPE_LBL).map(k=>({v:k,l:TYPE_LBL[k]})))}
      ${msHTML('exp','scopes','Flock',['Old','New','General'].map(k=>({v:k,l:k})))}
    </div>
    <div class="toolbar second">
      ${rangeHTML('exp')}
      <div style="flex:1"></div>
      ${resetBtn('exp')}
      <button class="btn ghost sm" onclick="exportExpFiltered()">⬇ CSV</button>
      <button class="btn" onclick="expForm()">${ICN.plus} New Expense</button>
    </div>
    <div id="expSum"></div>
    <div id="expFeed"></div>
    <div class="cntline" id="expCnt"></div>
    <div class="tcard"><div class="twrap"><table>
      <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Qty</th><th>Flock</th><th class="num">Amount</th><th class="num">Actions</th></tr></thead>
      <tbody id="expBody"></tbody></table></div></div>`;
  REF.exp=renderExpRows; renderExpRows();
}
function renderExpRows(){
  const list=expFiltered(), f=F.exp;
  const total=list.reduce((a,e)=>a+ +e.amount,0);
  const by={};
  list.forEach(e=>{const c=e.category||'Misc';const b=by[c]||(by[c]={n:0,amt:0,q:{}});b.n++;b.amt+= +e.amount;
    if(+e.qty>0){const u=e.unit||'units';b.q[u]=(b.q[u]||0)+ +e.qty;}});
  const rows=Object.entries(by).sort((a,b)=>b[1].amt-a[1].amt);
  const top=rows[0];
  const brk=rows.map(([c,b])=>{
    const qs=Object.entries(b.q).map(([u,q])=>`${numf(+q.toFixed(1))} ${u}`).join(' · ')||'—';
    const pc=total?(b.amt/total*100):0;
    return `<tr><td><span class="chip ${c.toLowerCase()}">${c}</span></td><td class="num">${numf(b.n)}</td><td>${qs}</td>
      <td class="num money">${moneyT(b.amt)}</td>
      <td style="min-width:140px"><div class="bar-bg"><i style="width:${pc.toFixed(0)}%"></i></div></td><td class="num dt">${pc.toFixed(1)}%</td></tr>`;}).join('');
  el("expSum").innerHTML=`
    <div class="kpis">
      ${kp('Total Spent',money(total),f.cats.size?[...f.cats].join(' + '):'All categories','i-red','v-red')}
      ${kp('Records',numf(list.length),`of ${numf(S.expenses.length)} total`,'i-indigo')}
      ${kp('Biggest Category',top?top[0]:'—',top?moneyT(top[1].amt):'&nbsp;','i-amber')}
    </div>
    <div class="panel" style="margin-bottom:16px"><div class="ph"><span class="bar" style="background:var(--amber)"></span><h3>Category-wise Summary</h3></div>
      <div class="twrap"><table><thead><tr><th>Category</th><th class="num">Records</th><th>Quantity bought</th><th class="num">Amount</th><th>Share</th><th class="num">%</th></tr></thead>
      <tbody>${brk||'<tr><td colspan=6 class="empty">Nothing matches</td></tr>'}</tbody>
      ${rows.length>1?`<tfoot><tr><td style="font-weight:800">Total</td><td class="num" style="font-weight:800">${numf(list.length)}</td><td></td><td class="num money" style="font-weight:800">${moneyT(total)}</td><td></td><td></td></tr></tfoot>`:''}
      </table></div></div>`;
  el("expFeed").innerHTML=(!f.cats.size||f.cats.has('Feed'))?feedHistoryHTML():'';
  el("expCnt").textContent=`Showing ${list.length} of ${S.expenses.length} expenses`;
  el("expBody").innerHTML=list.map(e=>`<tr>
    <td class="dt">${fmtDate(e.expense_date)}</td><td><span class="chip ${(e.category||'misc').toLowerCase()}">${e.category||'Misc'}</span></td>
    <td>${e.description||"—"}</td>
    <td class="num">${+e.qty>0?numf(e.qty)+' '+(e.unit||''):'—'}</td>
    <td class="dt">${e.flock_scope||"—"}</td><td class="num money">${moneyT(e.amount)}</td>
    <td class="num"><button class="iconbtn" onclick='expForm(${JSON.stringify(e)})'>${ICN.edit}</button>
      <button class="iconbtn del" onclick="delRow('expenses','${e.id}')">${ICN.del}</button></td></tr>`).join("")
    ||`<tr><td colspan=7 class="empty"><div class="big">🧾</div>No expenses match these filters</td></tr>`;
}
function exportExpFiltered(){
  csvOut("henzo_expenses_filtered",["Date","Category","Type","Description","Flock","Qty","Unit","Unit_Price","Amount"],
    expFiltered().map(e=>[e.expense_date,e.category,e.type,e.description,e.flock_scope,e.qty,e.unit,e.unit_price,e.amount]));
}

/* ================= ORDERS ================= */
function ordFiltered(){
  const f=F.ord;
  return (S.orders||[]).filter(o=>{
    if(f.q && !((o.customer_name||'')+' '+(o.order_number||'')+' '+(o.phone||'')).toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.status.size && !f.status.has(o.status)) return false;
    if(f.items.size && ![...f.items].some(k=>k==='eggs'?+o.eggs_dozens>0:k==='meat'?+o.meat_kg>0:+o.chicks>0)) return false;
    if(f.from && (!o.delivery_date||o.delivery_date<f.from)) return false;
    if(f.to && (!o.delivery_date||o.delivery_date>f.to)) return false;
    return true;
  });
}
function vOrders(){
  el("view").innerHTML=`
    <div class="toolbar">
      <div class="search">${ICN.search}<input placeholder="Search customer, order #, phone…" value="${esc(F.ord.q)}" oninput="F.ord.q=this.value;REF.ord()"></div>
      ${msHTML('ord','status','Status',['Pending','Delivered','Cancelled'].map(k=>({v:k,l:k,n:(S.orders||[]).filter(o=>o.status===k).length})))}
      ${msHTML('ord','items','Items',ITEM_OPTS)}
    </div>
    <div class="toolbar second">
      ${rangeHTML('ord')}
      <div style="flex:1"></div>
      ${resetBtn('ord')}
      <button class="btn" onclick="orderForm()">${ICN.plus} New Order</button>
    </div>
    <div id="ordSum"></div>
    <div id="ordersGroups"></div>`;
  REF.ord=renderOrderRows; renderOrderRows();
}
function renderOrderRows(){
  const list=ordFiltered(), sel=F.ord.items, show=k=>!sel.size||sel.has(k);
  const T={dz:0,kg:0,ch:0,val:0}; list.forEach(o=>{T.dz+=+o.eggs_dozens||0;T.kg+=+o.meat_kg||0;T.ch+=+o.chicks||0;T.val+=+o.total_amount||0;});
  const cards=[kp('Orders',numf(list.length),F.ord.status.size?[...F.ord.status].join(' + '):'All statuses','i-indigo')];
  if(show('eggs')) cards.push(kp('Eggs',`${numf(T.dz)} <span style="font-size:14px;color:var(--faint)">dozen</span>`,`${numf(Math.round(T.dz*12))} eggs (pieces)`,'i-indigo'));
  if(show('meat')) cards.push(kp('Meat',`${numf(+T.kg.toFixed(1))} <span style="font-size:14px;color:var(--faint)">kg</span>`,'&nbsp;','i-red'));
  if(show('chicks')) cards.push(kp('Chicks',numf(T.ch),'&nbsp;','i-amber'));
  cards.push(kp('Order Value',money(T.val),'&nbsp;','i-emerald','v-emerald'));
  el("ordSum").innerHTML=`<div class="kpis">${cards.join('')}</div>`;

  if(!list.length){ el("ordersGroups").innerHTML=`<div class="tcard"><div class="empty"><div class="big">📦</div>No orders match these filters</div></div>`; return; }
  const groups={}; list.forEach(o=>{const k=o.delivery_date||'No date set';(groups[k]=groups[k]||[]).push(o);});
  const keys=Object.keys(groups).sort((a,b)=>a==='No date set'?1:b==='No date set'?-1:new Date(a)-new Date(b));
  const today=ymd(new Date());
  el("ordersGroups").innerHTML=keys.map(dk=>{
    const rows=groups[dk], dayTotal=rows.reduce((a,o)=>a+ +o.total_amount,0);
    const label=dk==='No date set'?'No date set':(dk===today?`${fmtDate(dk)} — TODAY`:fmtDate(dk));
    return `<div class="tcard" style="margin-bottom:14px">
      <div class="ph" style="padding:14px 18px"><span class="bar" style="${dk===today?'background:var(--red)':''}"></span>
        <h3 style="font-size:14px">${label}</h3><span class="sp"></span>
        <span class="chip misc">${rows.length} order${rows.length>1?'s':''} · ${moneyT(dayTotal)}</span></div>
      <div class="twrap"><table>
        <thead><tr><th>Order #</th><th>Customer</th><th>Phone</th><th>Items</th><th class="num">Total</th><th>Status</th><th class="num">Actions</th></tr></thead>
        <tbody>${rows.map(o=>`<tr>
          <td class="dt">${o.order_number||'—'}</td><td class="cust">${o.customer_name}</td><td class="dt">${o.phone||'—'}</td>
          <td>${orderItemLabel(o)}</td><td class="num money">${moneyT(o.total_amount)}</td>
          <td><span class="chip ${o.status==='Delivered'?'online':o.status==='Cancelled'?'meat':'cash'}">${o.status}</span></td>
          <td class="num" style="white-space:nowrap">
            <button class="iconbtn" title="Print bill" onclick='printInvoice(${JSON.stringify(o)})'>🖨️</button>
            ${o.status==='Pending'?`<button class="iconbtn" onclick='orderForm(${JSON.stringify(o)})'>${ICN.edit}</button>
            <button class="btn sm" style="background:var(--emerald)" onclick='deliverOrder(${JSON.stringify(o)})'>Delivered</button>
            <button class="btn ghost sm" style="color:var(--red)" onclick='cancelOrder(${JSON.stringify(o)})'>Cancel</button>`:''}
            <button class="iconbtn del" onclick="delRow('orders','${o.id}');" title="Delete order">${ICN.del}</button>
          </td></tr>`).join("")}</tbody></table></div></div>`;
  }).join("");
}

/* ================= CUSTOMERS ================= */
function cusData(){
  const f=F.cus;
  const sales=S.sales.filter(s=>{
    if(f.items.size && ![...f.items].some(k=>sHas(s,k))) return false;
    if(f.from && s.sale_date<f.from) return false;
    if(f.to && s.sale_date>f.to) return false;
    return true;
  });
  const m={};
  sales.forEach(s=>{const n=s.customer_name||'—';const b=m[n]||(m[n]={name:n,transactions:0,billed:0,received:0,outstanding:0});
    b.transactions++;b.billed+= +s.total_amount;b.received+= +s.amount_paid;b.outstanding+=(+s.total_amount-+s.amount_paid);});
  return Object.values(m).filter(c=>{
    if(f.q && !c.name.toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.status.size){const st=c.outstanding>0?'due':'clear'; if(!f.status.has(st)) return false;}
    return true;
  }).sort((a,b)=>b.outstanding-a.outstanding||b.billed-a.billed);
}
function vCustomers(){
  el("view").innerHTML=`
    <div class="toolbar">
      <div class="search">${ICN.search}<input placeholder="Search customer…" value="${esc(F.cus.q)}" oninput="F.cus.q=this.value;REF.cus()"></div>
      ${msHTML('cus','status','Balance',[{v:'due',l:'Has outstanding'},{v:'clear',l:'Clear'}])}
      ${msHTML('cus','items','Bought',ITEM_OPTS)}
    </div>
    <div class="toolbar second">
      ${rangeHTML('cus')}
      <div style="flex:1"></div>
      ${resetBtn('cus')}
      <button class="btn" onclick="custForm()">${ICN.plus} Add Customer</button>
    </div>
    <div id="cusSum"></div>
    <div class="tcard"><div class="twrap"><table>
      <thead><tr><th>Customer</th><th class="num">Sales</th><th class="num">Billed</th><th class="num">Received</th><th class="num">Balance</th><th class="num">Actions</th></tr></thead>
      <tbody id="cusBody"></tbody></table></div></div>`;
  REF.cus=renderCusRows; renderCusRows();
}
function renderCusRows(){
  const b=cusData(), due=b.reduce((a,c)=>a+c.outstanding,0), billed=b.reduce((a,c)=>a+c.billed,0), rec=b.reduce((a,c)=>a+c.received,0);
  el("cusSum").innerHTML=`<div class="kpis">${kp('Customers',numf(b.length),'matching filters','i-indigo')}${kp('Billed',money(billed),'&nbsp;','i-indigo')}${kp('Received',money(rec),'&nbsp;','i-emerald','v-emerald')}${kp('Outstanding',money(due),'&nbsp;','i-red','v-red')}</div>`;
  el("cusBody").innerHTML=b.map(c=>`<tr><td class="cust" style="cursor:pointer" onclick="custHistory('${c.name.replace(/'/g,"\\'")}')">${c.name}</td><td class="num">${numf(c.transactions)}</td>
    <td class="num money">${moneyT(c.billed)}</td><td class="num clr">${moneyT(c.received)}</td>
    <td class="num">${c.outstanding>0?`<span class="due">${moneyT(c.outstanding)}</span>`:`<span class="clr">Clear</span>`}</td>
    <td class="num"><button class="btn ghost sm" onclick="saleForm(null,'${c.name.replace(/'/g,"\\'")}')">+ Sale/Payment</button></td></tr>`).join("")
    ||'<tr><td colspan=6 class="empty">No customers match</td></tr>';
}

/* ================= FLOCKS ================= */
function vFlocks(){
  el("view").innerHTML=`
    <div class="toolbar">
      ${msHTML('flk','ids','Flocks',S.flocks.map(f=>({v:String(f.id),l:esc(f.name),n:numf(f.live_birds)+' live'})))}
      <div style="flex:1"></div>
      ${resetBtn('flk')}
      <button class="btn" onclick="flockForm()">${ICN.plus} Add Flock</button>
    </div>
    <div id="flkSum"></div><div class="flocks" id="flkCards"></div>`;
  REF.flk=renderFlocks; renderFlocks();
}
function renderFlocks(){
  const fl=S.flocks.filter(f=>!F.flk.ids.size||F.flk.ids.has(String(f.id)));
  const spentOf=f=>S.expenses.filter(e=>e.flock_id===f.id).reduce((a,e)=>a+ +e.amount,0);
  const T={st:0,d:0,so:0,l:0,sp:0}; fl.forEach(f=>{T.st+=+f.start_count||0;T.d+=+f.mortality||0;T.so+=+f.sold||0;T.l+=+f.live_birds||0;T.sp+=spentOf(f);});
  el("flkSum").innerHTML=`<div class="kpis">${kp('Started',numf(T.st),`${fl.length} flock${fl.length===1?'':'s'}`,'i-indigo')}${kp('Died',numf(T.d),T.st?(T.d/T.st*100).toFixed(1)+'% mortality':'&nbsp;','i-red','v-red')}${kp('Sold',numf(T.so),'&nbsp;','i-amber')}${kp('Live Birds',numf(T.l),'&nbsp;','i-emerald','v-emerald')}${kp('Spent (tagged)',money(T.sp),'&nbsp;','i-amber')}</div>`;
  el("flkCards").innerHTML=fl.map(f=>{
    const spent=spentOf(f), start=+f.start_count||0,mort=+f.mortality||0,sold=+f.sold||0,live=+f.live_birds,surv=start?((live/start)*100).toFixed(1):0;
    return `<div class="fcard"><div class="fh"><h3>${f.name}</h3><span class="tag">${f.breed||'—'}</span>
      <span style="flex:1"></span><button class="iconbtn" onclick='flockForm(${JSON.stringify(f)})'>${ICN.edit}</button></div>
      <div class="dt" style="font-size:12px;margin-bottom:8px">Purchased ${fmtDate(f.purchased)}</div>
      <div class="fstats" style="grid-template-columns:repeat(4,1fr)">
        <div class="fstat"><div class="l">Start</div><div class="n">${numf(start)}</div></div>
        <div class="fstat"><div class="l">Died</div><div class="n v-red">${numf(mort)}</div></div>
        <div class="fstat"><div class="l">Sold</div><div class="n">${numf(sold)}</div></div>
        <div class="fstat"><div class="l">Live</div><div class="n v-emerald">${numf(live)}</div></div></div>
      <div class="prog"><i style="width:${surv}%"></i></div>
      <div class="prog-lbl"><span>Survival ${surv}%</span><span>Spent ${moneyT(spent)}</span></div></div>`;
  }).join("")||'<div class="empty">No flocks match</div>';
}

/* ================= REPORTS (date-range) ================= */
function vReports(){
  el("view").innerHTML=`
    <div class="toolbar">${rangeHTML('rep')}<div style="flex:1"></div>${resetBtn('rep')}</div>
    <div id="repBody"></div>
    <div class="tcard"><div class="ph" style="padding:18px 20px"><span class="bar"></span><h3>Export Data</h3></div>
      <div class="pb" style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn ghost" onclick="exportCSV('sales')">⬇ All Sales (CSV)</button>
        <button class="btn ghost" onclick="exportCSV('expenses')">⬇ All Expenses (CSV)</button>
        <button class="btn" onclick="downloadFullBackup()">${ICN.download} Download Full Backup (JSON)</button>
        <button class="btn ghost" onclick="window.print()">🖨 Print this report</button>
      </div>
      <div class="pb" style="padding-top:0"><span class="hint" id="lastBackupHint"></span></div></div>`;
  const last=localStorage.getItem(BACKUP_KEY);
  el("lastBackupHint").textContent=last?`Last full backup: ${new Date(last).toLocaleString()}`:"You haven't downloaded a full backup yet.";
  REF.rep=renderReport; renderReport();
}
function renderReport(){
  const f=F.rep, inR=d=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
  const sales=S.sales.filter(s=>inR(s.sale_date)), exps=S.expenses.filter(e=>inR(e.expense_date));
  const rev=sales.reduce((a,s)=>a+ +s.total_amount,0), paid=sales.reduce((a,s)=>a+ +s.amount_paid,0);
  const sumT=t=>exps.filter(e=>e.type===t).reduce((a,e)=>a+ +e.amount,0);
  const opCost=sumT('operating'), capex=sumT('capex'), bird=sumT('biological'), opProfit=rev-opCost;
  const T={dz:0,birds:0,kg:0,chicks:0,eggRev:0,meatRev:0,chickRev:0}; sales.forEach(s=>{const p=sParts(s);for(const k in T)T[k]+=p[k];});
  const custs=new Set(sales.map(s=>s.customer_name||'—')).size;
  const byC={}; exps.forEach(e=>{const c=e.category||'Misc';byC[c]=(byC[c]||0)+ +e.amount;});
  const catRows=Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td><span class="chip ${c.toLowerCase()}">${c}</span></td><td class="num money">${moneyT(v)}</td></tr>`).join('');
  el("repBody").innerHTML=`
    <div class="grid-2" style="grid-template-columns:1fr 1fr">
      <div class="panel"><div class="ph"><span class="bar"></span><h3>Profit &amp; Loss Summary</h3></div>
        <div class="pb"><table><tbody>
          <tr><td>Total Revenue</td><td class="num money v-emerald">${moneyT(rev)}</td></tr>
          <tr><td>Cash Collected</td><td class="num money">${moneyT(paid)}</td></tr>
          <tr><td>Outstanding Khata</td><td class="num money v-red">${moneyT(rev-paid)}</td></tr>
          <tr><td>Operating Cost</td><td class="num money v-red">${moneyT(opCost)}</td></tr>
          <tr style="border-top:2px solid var(--line-2)"><td style="font-weight:800">Operating ${opProfit>=0?'Profit':'Loss'}</td>
            <td class="num money ${opProfit>=0?'v-emerald':'v-red'}" style="font-size:16px">${moneyT(opProfit)}</td></tr>
          <tr><td class="dt">Capital Invested (setup)</td><td class="num money">${moneyT(capex)}</td></tr>
          <tr><td class="dt">Bird Investment (chicks)</td><td class="num money">${moneyT(bird)}</td></tr>
        </tbody></table></div></div>
      <div class="panel"><div class="ph"><span class="bar" style="background:var(--emerald)"></span><h3>Sales by Item</h3></div>
        <div class="pb"><table><thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Revenue</th></tr></thead><tbody>
          <tr><td>🥚 Eggs</td><td class="num">${numf(T.dz)} dz · ${numf(Math.round(T.dz*12))} pcs</td><td class="num money">${moneyT(T.eggRev)}</td></tr>
          <tr><td>🍗 Roasters / Meat</td><td class="num">${numf(T.birds)} birds · ${numf(+T.kg.toFixed(1))} kg</td><td class="num money">${moneyT(T.meatRev)}</td></tr>
          <tr><td>🐣 Chicks</td><td class="num">${numf(T.chicks)}</td><td class="num money">${moneyT(T.chickRev)}</td></tr>
          <tr style="border-top:2px solid var(--line-2)"><td>Transactions</td><td class="num money">${numf(sales.length)}</td><td></td></tr>
          <tr><td>Active Customers</td><td class="num money">${numf(custs)}</td><td></td></tr>
          <tr><td>Live Birds (now)</td><td class="num money">${numf(S.flocks.reduce((a,x)=>a+ +x.live_birds,0))}</td><td></td></tr>
        </tbody></table></div></div>
    </div>
    <div class="panel" style="margin-bottom:16px"><div class="ph"><span class="bar" style="background:var(--amber)"></span><h3>Expenses by Category</h3></div>
      <div class="pb"><table><tbody>${catRows||'<tr><td class="empty">No expenses in this period</td></tr>'}</tbody></table></div></div>`;
}
</script>
